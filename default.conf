server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Compresión
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets con hash: cache agresivo
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Redirigir la raíz hacia la app
  location = / {
    return 302 /mis-negocios/;
  }

  # SPA bajo /mis-negocios/: fallback al index de la subcarpeta.
  # index.html nunca se cachea para que los deploys se reflejen de inmediato.
  location /mis-negocios/ {
    try_files $uri $uri/ /mis-negocios/index.html;
    add_header Cache-Control "no-cache";
  }
}